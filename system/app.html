<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="对话消息, 工具调用, 子代理, 输入框与上下文编辑集成示例">
  <title>对话界面集成示例 - context-editor-ui</title>
  <script src="design-system.config.js?v=small-disclosure-1"></script>
  <script src="motion-runtime.js?v=motion-system-1"></script>
  <script src="icon-set.js?v=thin-icons-1"></script>
  <link rel="stylesheet" href="styles.css?v=code-copy-feedback-1">
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="Icons.js?v=generated-icons-1"></script>
  <script type="text/babel" src="MotionPresence.js?v=motion-system-1"></script>
  <script type="text/babel" src="components/MessageBubble/MessageBubble.js?v=message-feedback-1"></script>
  <script type="text/babel" src="components/ToolCall/ToolCall.js?v=motion-system-1"></script>
  <script type="text/babel" src="components/SubagentCall/SubagentCall.js?v=inline-agents-1"></script>
  <script type="text/babel" src="components/Composer/Composer.js?v=motion-system-1"></script>
  <script type="text/babel" src="components/ContextEditor/ContextEditor.js?v=motion-system-1"></script>
  <script type="text/babel">
    const demo = ContextEditorUIConfig.integratedDemo
    const contextDemo = ContextEditorUIConfig.components.contextEditor.demo

    function App() {
      const editor = useContextEditor(contextDemo.draft, contextDemo.pending)
      const [sent, setSent] = React.useState([])
      const threadRef = React.useRef(null)
      const dockRef = React.useRef(null)

      const send = (text) => setSent((items) => [...items, text])

      React.useEffect(() => {
        if (!sent.length) return
        let cancelled = false, frame
        const thread = threadRef.current
        const turns = Array.from(thread.querySelectorAll(':scope > .motion-presence'))
        // Measure after all entering turns settle and the cleared input has resized
        Promise.all(turns.map(ContextEditorUIMotion.settled)).then(() => {
          if (cancelled) return
          frame = requestAnimationFrame(() => {
            const message = thread.lastElementChild
            const dock = dockRef.current
            if (cancelled || !message || !dock) return
            const gap = parseFloat(ContextEditorUI.tokenValue('--space-4'))
            const distance = message.getBoundingClientRect().bottom + gap - dock.getBoundingClientRect().top
            if (distance > 0) window.scrollBy({
              top: distance,
              behavior: ContextEditorUIMotion.duration('--motion-layout') ? 'smooth' : 'instant'
            })
          })
        })
        return () => { cancelled = true; cancelAnimationFrame(frame) }
      }, [sent.length])

      return (
        <main className="conversation-app" data-od-id="conversation-app">
          <div className="conversation-column">
            <section ref={threadRef} className="thread" aria-label="对话消息" data-od-id="conversation-thread">
              <p className="time-divider" data-od-id="time-divider">{demo.time}</p>

              <article className="turn" data-od-id="user-turn">
                <MessageBubble showMeta={true}>{demo.user}</MessageBubble>
              </article>

              <article className="turn" data-od-id="assistant-turn">
                <WorkedSummary duration={demo.duration}>
                  <p className="process-copy">{demo.process}</p>
                  <div className="tool-stack">
                    <SubagentCall name={demo.agents[0].name} tone={demo.agents[0].tone} status="started working"/>
                    <ToolCall kind="web" label={demo.toolWeb}/>
                    <SubagentCall {...demo.agents[0]} status="finished"/>
                    <SubagentCall {...demo.agents[1]} status="started working"/>
                    <ToolCall kind="command" label={demo.toolCommand} expandable output={demo.output} outputId="command-output"/>
                    <button className="tool-row tool-row-button" type="button" onClick={editor.openEditor} data-od-id="tool-context-editor">
                      <ContextIcon/>
                      <span className="tool-label">已打开上下文编辑区</span>
                      <ChevronDownIcon className="tool-chevron"/>
                    </button>
                    <SubagentCall {...demo.agents[1]} status="finished"/>
                  </div>
                </WorkedSummary>

                <AssistantMessage messageId="assistant-message">
                  {demo.assistant.map((paragraph) => <p key={paragraph}>{paragraph}</p>)}
                  <CodeObject label={demo.codeLabel} codeId="message-contract">{demo.code}</CodeObject>
                </AssistantMessage>

                <MessageActions targetId="assistant-message" onEditContext={editor.openEditor}/>
              </article>

              <MotionPresence show={editor.open} as="article" className="turn" data-od-id="context-editor-turn">
                  <ContextEditor {...editor.editorProps}/>
              </MotionPresence>

              {sent.map((text, index) => (
                <MotionPresence show appear as="article" className="turn" key={`${text}-${index}`} data-od-id="sent-user-turn">
                  <div className="message-row is-user"><div className="user-message">{text}</div></div>
                  <div className="user-meta is-visible"><span>刚刚</span></div>
                </MotionPresence>
              ))}
            </section>

            <div ref={dockRef} className="composer-dock" data-od-id="composer-dock">
              <div id="composer-root">
                <Composer onSend={send} onOpenContextEditor={editor.openEditor} onToggleContextEditor={editor.toggleEditor} includedCount={editor.includedCount} pendingCount={editor.pending.length} editorOpen={editor.open}/>
              </div>
            </div>
          </div>
        </main>
      )
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App/>)
  </script>
  <script src="interactions.js?v=message-feedback-1"></script>
</body>
</html>
