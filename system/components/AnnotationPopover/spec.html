<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>备注浮窗 - context-editor-ui</title>
  <script src="../../design-system.config.js?v=menu-corners-20260917"></script>
  <script src="../../motion-runtime.js?v=menu-corners-20260917"></script>
  <script src="../../icons.data.js?v=menu-corners-20260917"></script>
  <script src="../../icon-set.js?v=menu-corners-20260917"></script>
  <link rel="stylesheet" href="../../styles.css?v=menu-corners-20260917">
</head>
<body>
  <main class="review-shell" data-od-id="annotation-preview">
    <header class="review-head"><div><p class="eyebrow" data-config-eyebrow></p><h1 data-config-title></h1><p class="lede" data-config-lede></p></div><p data-config-summary></p></header>
    <section class="review-section"><div class="section-head"><h2>组件示例</h2><p>通过标签查看与编辑备注, 检查隐藏会话后的草稿保留</p></div><div class="component-demo" id="annotation-demo-root"></div></section>
    <section class="review-section"><div class="section-head"><h2>设计规范</h2><p data-config-rules-intro></p></div><dl class="spec-list" data-config-rules></dl></section>
    <section class="review-section"><div class="section-head"><h2>设计参数</h2><p data-config-parameters-intro></p></div><div class="parameter-grid" data-config-parameters></div></section>
    <footer class="review-foot" data-config-footer></footer>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="../../Icons.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="../Button/Button.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="../Panel/Panel.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="./AnnotationPopover.js?v=menu-corners-20260917"></script>
  <script type="text/babel">
    function AnnotationDemo() {
      const demo = ContextEditorUIConfig.components.annotation.demo
      const [annotation, setAnnotation] = React.useState(() => ({ ...demo }))
      const [active, setActive] = React.useState(true)
      return <Panel><div className="annotation-demo">
        <p>悬停, 聚焦或点击备注标签查看详情, 关闭后保留未保存草稿</p>
        <AnnotationPopover annotation={annotation} onChange={setAnnotation} active={active}/>
        <div className="annotation-demo-actions">
          {!annotation ? <Button type="button" tone="neutral" variant="ghost" onClick={() => setAnnotation({ ...demo })}>重新添加示例备注</Button> : null}
          <Button type="button" tone="neutral" variant="ghost" data-testid="annotation-toggle-active" onClick={() => setActive(value => !value)}>{active ? '隐藏当前会话' : '返回当前会话'}</Button>
        </div>
        <p role="status">{annotation ? annotation.editing && (annotation.draft ?? annotation.comment ?? '') !== (annotation.comment || '') ? '存在未保存备注, 调用方在发送前可以重新打开编辑器' : '当前备注已保存' : '当前没有备注'}</p>
      </div></Panel>
    }
    ReactDOM.createRoot(document.getElementById('annotation-demo-root')).render(<AnnotationDemo/>)
    ContextEditorUI.renderComponentPage('annotation')
  </script>
</body>
</html>
