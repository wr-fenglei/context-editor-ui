<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>上下文编辑 - context-editor-ui</title>
  <script src="../../design-system.config.js?v=agent-mark-2"></script>
  <script src="../../icon-set.js?v=unified-icons-1"></script>
  <link rel="stylesheet" href="../../styles.css?v=unified-icons-1">
</head>
<body>
  <main class="review-shell" data-od-id="context-editor-preview">
    <header class="review-head"><div><p class="eyebrow" data-config-eyebrow></p><h1 data-config-title data-od-id="context-editor-title"></h1><p class="lede" data-config-lede></p></div><p data-config-summary></p></header>
    <section class="review-section" data-od-id="context-editor-demo"><div class="section-head"><h2>组件示例</h2><p>真实状态: 纳入, 排除, 排序, 并入与确认均可操作</p></div><div class="stage component-demo" id="context-editor-demo-root"></div></section>
    <section class="review-section" data-od-id="context-editor-rules"><div class="section-head"><h2>设计规范</h2><p data-config-rules-intro></p></div><dl class="spec-list" data-config-rules></dl></section>
    <section class="review-section" data-od-id="context-editor-parameters"><div class="section-head"><h2>设计参数</h2><p data-config-parameters-intro></p></div><div class="parameter-grid" data-config-parameters></div></section>
    <footer class="review-foot" data-config-footer></footer>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="../../Icons.js?v=unified-icons-1"></script>
  <script type="text/babel" src="./ContextEditor.js?v=chinese-copy-1"></script>
  <script type="text/babel">
    const demo = ContextEditorUIConfig.components.contextEditor.demo
    function ContextEditorPreview() {
      const editor = useContextEditor(demo.draft, demo.pending)
      return <ContextEditor {...editor.editorProps} />
    }
    ReactDOM.createRoot(document.getElementById('context-editor-demo-root')).render(<ContextEditorPreview />)
    ContextEditorUI.renderComponentPage('contextEditor')
  </script>
</body>
</html>
