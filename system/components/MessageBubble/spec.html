<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>消息组件 - context-editor-ui</title>
  <script src="../../design-system.config.js?v=unified-icons-1"></script>
  <script src="../../icon-set.js?v=unified-icons-1"></script>
  <link rel="stylesheet" href="../../styles.css?v=unified-icons-1">
</head>
<body>
  <main class="review-shell" data-od-id="messages-preview">
    <header class="review-head"><div><p class="eyebrow" data-config-eyebrow></p><h1 data-config-title data-od-id="messages-title"></h1><p class="lede" data-config-lede></p></div><p data-config-summary></p></header>
    <section class="review-section" data-od-id="messages-demo"><div class="section-head"><h2>组件示例</h2><p>消息层级, 内容布局与操作反馈</p></div><div class="stage component-demo" id="messages-demo-root"></div><p class="live-copy-status" data-live-status role="status" aria-live="polite"></p></section>
    <section class="review-section" data-od-id="messages-rules"><div class="section-head"><h2>设计规范</h2><p data-config-rules-intro></p></div><dl class="spec-list" data-config-rules></dl></section>
    <section class="review-section" data-od-id="messages-parameters"><div class="section-head"><h2>设计参数</h2><p data-config-parameters-intro></p></div><div class="parameter-grid" data-config-parameters></div></section>
    <footer class="review-foot" data-config-footer></footer>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="../../Icons.js?v=unified-icons-1"></script>
  <script type="text/babel" src="./MessageBubble.js?v=unified-icons-1"></script>
  <script type="text/babel">
    const demo = ContextEditorUIConfig.components.messages.demo
    ReactDOM.createRoot(document.getElementById('messages-demo-root')).render(
      <div className="demo-turns">
        <article className="turn"><MessageBubble showMeta={true}>{demo.user}</MessageBubble></article>
        <article className="turn"><WorkedSummary duration={demo.duration}><p className="process-copy">{demo.process}</p></WorkedSummary><AssistantMessage messageId="preview-assistant-message">{demo.assistant.map((paragraph) => <p key={paragraph}>{paragraph}</p>)}<CodeObject label={demo.codeLabel} codeId="preview-message-contract">{demo.code}</CodeObject></AssistantMessage><MessageActions targetId="preview-assistant-message" /></article>
      </div>
    )
    ContextEditorUI.renderComponentPage('messages')
  </script>
  <script src="../../interactions.js?v=local-copy-1"></script>
</body>
</html>
