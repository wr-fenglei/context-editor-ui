<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工具调用 - context-editor-ui</title>
  <script src="../../design-system.config.js?v=inline-agents-1"></script>
  <script src="../../motion-runtime.js?v=motion-system-1"></script>
  <script src="../../icon-set.js?v=thin-icons-1"></script>
  <link rel="stylesheet" href="../../styles.css?v=inline-agents-1">
</head>
<body>
  <main class="review-shell" data-od-id="tool-calls-preview">
    <header class="review-head"><div><p class="eyebrow" data-config-eyebrow></p><h1 data-config-title data-od-id="tools-title"></h1><p class="lede" data-config-lede></p></div><p data-config-summary></p></header>
    <section class="review-section" data-od-id="tools-demo"><div class="section-head"><h2>组件示例</h2><p>查看工具摘要, 展开输出与操作状态</p></div><div class="stage component-demo" id="tools-demo-root"></div></section>
    <section class="review-section" data-od-id="tools-rules"><div class="section-head"><h2>设计规范</h2><p data-config-rules-intro></p></div><dl class="spec-list" data-config-rules></dl></section>
    <section class="review-section" data-od-id="tools-parameters"><div class="section-head"><h2>设计参数</h2><p data-config-parameters-intro></p></div><div class="parameter-grid" data-config-parameters></div></section>
    <footer class="review-foot" data-config-footer></footer>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="../../Icons.js?v=generated-icons-1"></script>
  <script type="text/babel" src="../../MotionPresence.js?v=motion-system-1"></script>
  <script type="text/babel" src="./ToolCall.js?v=motion-system-1"></script>
  <script type="text/babel">
    const demo = ContextEditorUIConfig.components.tools.demo
    ReactDOM.createRoot(document.getElementById('tools-demo-root')).render(<div className="demo-tool-stack"><ToolCall kind="web" label={demo.rows[0]} /><ToolCall label={demo.rows[1]} expandable={true} output={demo.output} /><ToolCall kind="command" label={demo.rows[2]} expandable={true} output={demo.output} /></div>)
    ContextEditorUI.renderComponentPage('tools')
  </script>
</body>
</html>
