<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>输入框 - context-editor-ui</title>
  <script src="../../design-system.config.js?v=menu-corners-20260917"></script>
  <script src="../../motion-runtime.js?v=menu-corners-20260917"></script>
  <script src="../../icons.data.js?v=menu-corners-20260917"></script>
  <script src="../../icon-set.js?v=menu-corners-20260917"></script>
  <script src="../../code-format.js?v=menu-corners-20260917"></script>
  <link rel="stylesheet" href="../../styles.css?v=menu-corners-20260917">
</head>
<body>
  <main class="review-shell" data-od-id="composer-preview">
    <header class="review-head"><div><p class="eyebrow" data-config-eyebrow></p><h1 data-config-title data-od-id="composer-title"></h1><p class="lede" data-config-lede></p></div><p data-config-summary></p></header>
    <section class="review-section" data-od-id="composer-demo"><div class="section-head"><h2>组件示例</h2><p>体验输入, 发送, 模型选择和上下文编辑, 与对话示例共用组件和状态</p></div><div class="composer-preview-shell"><div id="composer-root"></div></div></section>
    <section class="review-section" data-od-id="composer-rules"><div class="section-head"><h2>设计规范</h2><p data-config-rules-intro></p></div><dl class="spec-list" data-config-rules></dl></section>
    <section class="review-section" data-od-id="composer-parameters"><div class="section-head"><h2>设计参数</h2><p data-config-parameters-intro></p></div><div class="parameter-grid" data-config-parameters></div></section>
    <footer class="review-foot" data-config-footer></footer>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script type="text/babel" src="../../Icons.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="../Button/Button.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="../../MotionPresence.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="../ContextEditor/ContextEditor.js?v=menu-corners-20260917"></script>
  <script type="text/babel" src="./Composer.js?v=menu-corners-20260917"></script>
  <script type="text/babel">
    function ComposerPreview() {
      const demo = ContextEditorUIConfig.components.contextEditor.demo
      const editor = useContextEditor(demo.draft, demo.pending, { initialOpen: false })
      const [lastSent, setLastSent] = React.useState(null)
      const send = (text) => setLastSent({ text, confirmedCount: editor.confirmedCount })
      return <div className="demo-stack">
        <div>
          <Composer includedCount={editor.confirmedCount} pendingCount={editor.pending.length} draftDirty={editor.dirty} editorOpen={editor.open} onOpenContextEditor={editor.openEditor} onToggleContextEditor={editor.toggleEditor} onSend={send}/>
          <ComposerHint/>
          <p className="live-copy-status" data-live-status role="status" aria-live="polite">{lastSent ? `最近发送: ${lastSent.text} · 使用 ${lastSent.confirmedCount} 项已确认上下文` : ''}</p>
        </div>
        <MotionPresence show={editor.open}><ContextEditor {...editor.editorProps}/></MotionPresence>
      </div>
    }
    ReactDOM.createRoot(document.getElementById('composer-root')).render(<ComposerPreview />)
    ContextEditorUI.renderComponentPage('composer')
  </script>
  <script src="../../interactions.js?v=menu-corners-20260917"></script>
</body>
</html>
